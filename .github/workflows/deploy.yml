name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      # Uncomment if you have tests
      # - run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/food_factory_backend:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/food_factory_backend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}

            docker pull ${{ secrets.DOCKER_USERNAME }}/food_factory_backend:latest

            docker stop food_factory_backend || true

            docker rm food_factory_backend || true

            docker run -d \
              --name food_factory_backend \
              --restart always \
              --network food-network \
              -p 5050:5050 \
              -e DATABASE_URL="postgres://postgres:manager@postgres-db:5432/FoodFactory" \
              ${{ secrets.DOCKER_USERNAME }}/food_factory_backend:latest      